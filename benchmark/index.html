<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Result Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/benchmark/styles.css">
</head>
<body>

<div class="app-container">
    <section class="search-section">
        <div class="search-input-wrapper">
            <h1 class="search-label mono">
                <span>API Result Comparison</span>
                <a class="page-link" href="/benchmark/research.html">Deep Research</a>
            </h1>
            <div class="search-input-row">
                <input type="text" class="search-input" id="queryInput" value="Search API for AI Agents" placeholder="Enter query..." aria-label="Search query" autocomplete="off" autofocus>
            </div>
        </div>
        <button class="search-button" type="button" id="searchButton">
            <div class="search-button-top mono" id="buttonStatus">EXECUTE</div>
            <div class="search-button-main mono">SEARCH<br>-&gt;</div>
        </button>
    </section>

    <main class="results-area" id="resultsArea" aria-live="polite"></main>
</div>

<div class="json-modal" id="jsonModal" hidden>
    <div class="json-modal-backdrop" data-action="close-json"></div>
    <section class="json-modal-panel" role="dialog" aria-modal="true" aria-labelledby="jsonModalTitle">
        <div class="json-modal-header">
            <div id="jsonModalTitle">RAW JSON</div>
            <button class="json-modal-close" type="button" data-action="close-json" aria-label="Close raw JSON">X</button>
        </div>
        <pre class="raw-json" id="jsonModalBody"></pre>
    </section>
</div>

<script src="/benchmark/app.js"></script>
</body>
</html>
