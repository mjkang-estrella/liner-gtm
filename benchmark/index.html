<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Comparator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg: oklch(0.985 0.006 255);
        --color-panel: oklch(0.998 0.004 255);
        --color-text: oklch(0.17 0.006 255);
        --color-muted: oklch(0.47 0.009 255);
        --color-soft: oklch(0.95 0.006 255);
        --color-rule: oklch(0.17 0.006 255);
        --color-error: oklch(0.52 0.13 28);
        --color-warn: oklch(0.58 0.09 78);
        --border-style: 1px solid var(--color-rule);
        --font-mono: 'Space Mono', monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .mono, button, summary {
        font-family: var(--font-mono);
        text-transform: uppercase;
        font-weight: 400;
    }

    input {
        font-family: var(--font-mono);
        font-weight: 400;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    a:hover,
    a:focus-visible {
        text-decoration: underline;
    }

    :focus-visible {
        outline: 2px solid var(--color-text);
        outline-offset: -2px;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        border-left: var(--border-style);
        border-right: var(--border-style);
        margin: 0 20px;
    }

    .search-section {
        display: flex;
        border-bottom: var(--border-style);
    }

    .search-input-wrapper {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        border-right: var(--border-style);
    }

    .search-label {
        padding: 14px 12px;
        border-bottom: var(--border-style);
        font-size: 18px;
        line-height: 1.1;
        background: var(--color-panel);
        color: var(--color-text);
    }

    .search-input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: stretch;
    }

    .search-input {
        width: 100%;
        border: none;
        padding: 22px 12px;
        font-size: 24px;
        outline: none;
        background: transparent;
    }

    .search-input:focus {
        background: var(--color-soft);
        box-shadow: inset 0 0 0 2px var(--color-text);
    }

    .search-input::placeholder {
        color: var(--color-muted);
    }

    .max-results {
        border: none;
        border-left: var(--border-style);
        background: transparent;
        color: var(--color-text);
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 0 12px;
        width: 96px;
        text-transform: uppercase;
    }

    .search-button {
        width: 200px;
        background-color: var(--color-bg);
        color: var(--color-text);
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 12px;
        transition: background-color 0.2s, color 0.2s;
    }

    .search-button:hover,
    .search-button:focus-visible {
        background-color: var(--color-text);
        color: var(--color-bg);
    }

    .search-button:disabled {
        cursor: wait;
        color: var(--color-muted);
        background: var(--color-soft);
    }

    .search-button-top {
        text-align: right;
        font-size: 10px;
    }

    .search-button-main {
        font-size: 24px;
        text-align: center;
    }

    .run-summary {
        min-height: 32px;
        border-bottom: var(--border-style);
        padding: 8px 12px;
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
    }

    .summary-muted {
        color: var(--color-muted);
    }

    .results-area {
        background-color: var(--color-rule);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1px;
        border-bottom: var(--border-style);
        flex-grow: 1;
    }

    .provider-card {
        background-color: var(--color-panel);
        display: flex;
        flex-direction: column;
        min-height: 400px;
        min-width: 0;
    }

    .card-header {
        border-bottom: var(--border-style);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
    }

    .provider-name {
        font-size: 16px;
        font-weight: 700;
    }

    .status-line {
        margin-top: 4px;
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
    }

    .status-error {
        color: var(--color-error);
    }

    .status-skipped {
        color: var(--color-warn);
    }

    .metrics {
        text-align: right;
        flex: 0 0 auto;
    }

    .metric-item {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
    }

    .metric-label {
        color: var(--color-muted);
    }

    .card-body {
        padding: 12px;
        flex-grow: 1;
        overflow-y: auto;
    }

    .result-snippet {
        margin-bottom: 14px;
    }

    .result-title {
        color: inherit;
        display: inline-block;
        font-weight: 700;
        font-size: 14px;
        line-height: 1.25;
        margin-bottom: 5px;
    }

    .result-title:hover,
    .result-title:focus-visible {
        text-decoration: underline;
    }

    .result-meta {
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 10px;
        margin-bottom: 4px;
        overflow-wrap: anywhere;
        text-transform: uppercase;
    }

    .result-text {
        font-size: 12.5px;
    }

    .state-message {
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.45;
        text-transform: uppercase;
    }

    .state-message strong {
        color: var(--color-text);
        font-weight: 700;
    }

    .skeleton-line {
        height: 12px;
        background: var(--color-soft);
        margin-bottom: 10px;
        position: relative;
        overflow: hidden;
    }

    .skeleton-line::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, oklch(0.985 0.004 255), transparent);
        animation: shimmer 1.1s infinite;
    }

    .skeleton-line.short {
        width: 55%;
    }

    .skeleton-line.medium {
        width: 78%;
    }

    @keyframes shimmer {
        to {
            transform: translateX(100%);
        }
    }

    .card-footer {
        border-top: var(--border-style);
    }

    .raw-details {
        font-family: var(--font-mono);
        font-size: 10px;
    }

    .raw-details summary {
        min-height: 44px;
        padding: 10px 12px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        list-style: none;
    }

    .raw-details summary::-webkit-details-marker {
        display: none;
    }

    .raw-details summary::after {
        content: "->";
    }

    .raw-details[open] summary {
        border-bottom: var(--border-style);
        background: var(--color-soft);
    }

    .raw-details[open] summary::after {
        content: "v";
    }

    .raw-json {
        max-height: 260px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        text-transform: none;
        font-size: 10px;
        line-height: 1.45;
    }

    @media (max-width: 720px) {
        .app-container {
            margin: 0;
            border-left: none;
            border-right: none;
        }

        .search-section {
            flex-direction: column;
        }

        .search-input-wrapper {
            border-right: none;
        }

        .search-label {
            font-size: 15px;
        }

        .search-input-row {
            grid-template-columns: 1fr;
        }

        .search-input {
            min-height: 88px;
            font-size: 18px;
        }

        .max-results {
            width: 100%;
            min-height: 44px;
            border-left: none;
            border-top: var(--border-style);
        }

        .search-button {
            width: 100%;
            min-height: 76px;
            border-top: var(--border-style);
            flex-direction: row;
            align-items: center;
        }

        .search-button-top,
        .search-button-main {
            text-align: left;
        }

        .results-area {
            grid-template-columns: 1fr;
        }

        .provider-card {
            min-height: 320px;
        }
    }

    @media (min-width: 721px) and (max-width: 1180px) {
        .results-area {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
</style>
</head>
<body>

<div class="app-container">
    <section class="search-section">
        <div class="search-input-wrapper">
            <h1 class="search-label mono">Search API comparison</h1>
            <div class="search-input-row">
                <input type="text" class="search-input" id="queryInput" value="impact of augmented reality on modern architecture" placeholder="Enter query..." aria-label="Search query" autocomplete="off" autofocus>
                <input type="number" class="max-results" id="maxResultsInput" value="5" min="1" max="10" aria-label="Max results">
            </div>
        </div>
        <button class="search-button" type="button" id="searchButton">
            <div class="search-button-top mono" id="buttonStatus">EXECUTE</div>
            <div class="search-button-main mono">SEARCH<br>-&gt;</div>
        </button>
    </section>

    <div class="run-summary" id="runSummary">
        <span>READY</span>
        <span class="summary-muted">CMD/CTRL + ENTER TO RUN</span>
        <span class="summary-muted">MISSING KEYS WILL BE SKIPPED</span>
    </div>

    <main class="results-area" id="resultsArea" aria-live="polite"></main>
</div>

<script>
    const providers = [
        { id: 'liner', name: 'LINER' },
        { id: 'exa', name: 'EXA' },
        { id: 'perplexity', name: 'PERPLEXITY' },
        { id: 'parallel', name: 'PARALLEL' },
        { id: 'tavily', name: 'TAVILY' },
        { id: 'brave', name: 'BRAVE' },
    ];

    const state = {
        isSearching: false,
        providers: providers.map((provider) => ({
            ...provider,
            status: 'idle',
            latencyMs: null,
            resultCount: 0,
            requestId: null,
            nativeCost: null,
            nativeUsage: null,
            raw: null,
            results: [],
            error: null,
        })),
        lastRun: null,
        error: null,
    };

    const queryInput = document.querySelector('#queryInput');
    const maxResultsInput = document.querySelector('#maxResultsInput');
    const searchButton = document.querySelector('#searchButton');
    const buttonStatus = document.querySelector('#buttonStatus');
    const resultsArea = document.querySelector('#resultsArea');
    const runSummary = document.querySelector('#runSummary');

    window.addEventListener('DOMContentLoaded', () => {
        queryInput.focus();
        queryInput.setSelectionRange(queryInput.value.length, queryInput.value.length);
        render();
    });

    searchButton.addEventListener('click', runSearch);

    queryInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            runSearch();
        }
    });

    async function runSearch() {
        const query = queryInput.value.trim();
        const maxResults = clampNumber(maxResultsInput.value, 1, 10, 5);

        if (!query || state.isSearching) return;

        state.isSearching = true;
        state.error = null;
        state.lastRun = null;
        state.providers = providers.map((provider) => ({
            ...provider,
            status: 'loading',
            latencyMs: null,
            resultCount: 0,
            requestId: null,
            nativeCost: null,
            nativeUsage: null,
            raw: null,
            results: [],
            error: null,
        }));
        render();

        try {
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query, maxResults }),
            });
            const payload = await response.json();

            if (!response.ok) {
                throw new Error(payload.error || 'Search failed');
            }

            state.providers = payload.providers;
            state.lastRun = payload;
        } catch (error) {
            state.error = error.message || 'Search failed';
            state.providers = providers.map((provider) => ({
                ...provider,
                status: 'error',
                latencyMs: null,
                resultCount: 0,
                requestId: null,
                nativeCost: null,
                nativeUsage: null,
                raw: null,
                results: [],
                error: { message: state.error },
            }));
        } finally {
            state.isSearching = false;
            render();
        }
    }

    function render() {
        searchButton.disabled = state.isSearching;
        buttonStatus.textContent = state.isSearching ? 'RUNNING' : 'EXECUTE';
        resultsArea.innerHTML = state.providers.map(renderProviderCard).join('');
        renderSummary();
    }

    function renderSummary() {
        if (state.error) {
            runSummary.innerHTML = `<span>ERROR</span><span class="summary-muted">${escapeHtml(state.error)}</span>`;
            return;
        }

        if (state.isSearching) {
            runSummary.innerHTML = '<span>SEARCHING</span><span class="summary-muted">CALLING PROVIDERS IN PARALLEL</span>';
            return;
        }

        if (!state.lastRun) {
            runSummary.innerHTML = '<span>READY</span><span class="summary-muted">CMD/CTRL + ENTER TO RUN</span><span class="summary-muted">MISSING KEYS WILL BE SKIPPED</span>';
            return;
        }

        const okCount = state.providers.filter((provider) => provider.status === 'ok').length;
        const skippedCount = state.providers.filter((provider) => provider.status === 'skipped').length;
        const errorCount = state.providers.filter((provider) => provider.status === 'error').length;

        runSummary.innerHTML = [
            `<span>QUERY: ${escapeHtml(state.lastRun.query)}</span>`,
            `<span class="summary-muted">TOTAL: ${state.lastRun.totalLatencyMs}ms</span>`,
            `<span class="summary-muted">OK: ${okCount}</span>`,
            `<span class="summary-muted">SKIP: ${skippedCount}</span>`,
            `<span class="summary-muted">ERR: ${errorCount}</span>`,
        ].join('');
    }

    function renderProviderCard(provider) {
        const statusClass = provider.status === 'error'
            ? 'status-error'
            : provider.status === 'skipped'
                ? 'status-skipped'
                : '';

        return `
            <article class="provider-card">
                <div class="card-header">
                    <div>
                        <div class="provider-name mono">${escapeHtml(provider.name)}</div>
                        <div class="status-line ${statusClass}">${escapeHtml(getStatusLabel(provider))}</div>
                    </div>
                    <div class="metrics">
                        <div class="metric-item"><span class="metric-label">LAT:</span> ${formatLatency(provider.latencyMs)}</div>
                        <div class="metric-item"><span class="metric-label">RES:</span> ${provider.resultCount ?? provider.results?.length ?? 0}</div>
                        <div class="metric-item"><span class="metric-label">SIG:</span> ${escapeHtml(getSignals(provider))}</div>
                    </div>
                </div>
                <div class="card-body">
                    ${renderProviderBody(provider)}
                </div>
                <div class="card-footer">
                    ${renderRawDetails(provider)}
                </div>
            </article>
        `;
    }

    function renderProviderBody(provider) {
        if (provider.status === 'loading') return renderSkeleton();

        if (provider.status === 'idle') {
            return '<div class="state-message">Awaiting search execution.</div>';
        }

        if (provider.status === 'skipped') {
            return `<div class="state-message"><strong>Skipped</strong><br>${escapeHtml(provider.error?.message || 'Missing API key')}</div>`;
        }

        if (provider.status === 'error') {
            const status = provider.error?.httpStatus ? `HTTP ${provider.error.httpStatus}` : 'REQUEST ERROR';
            return `<div class="state-message status-error"><strong>${escapeHtml(status)}</strong><br>${escapeHtml(provider.error?.message || 'Provider failed')}</div>`;
        }

        if (!provider.results || provider.results.length === 0) {
            return '<div class="state-message">No normalized results returned.</div>';
        }

        return provider.results.map(renderResult).join('');
    }

    function renderResult(result, index) {
        const meta = [
            result.publishedDate ? `PUB ${formatDate(result.publishedDate)}` : null,
            result.updatedDate ? `UPD ${formatDate(result.updatedDate)}` : null,
            typeof result.score === 'number' ? `SCORE ${formatScore(result.score)}` : null,
            result.favicon ? 'FAVICON' : null,
        ].filter(Boolean).join(' / ');

        return `
            <div class="result-snippet">
                <a href="${escapeAttribute(result.url || '#')}" class="result-title" target="_blank" rel="noreferrer">${escapeHtml(result.title || `Result ${index + 1}`)}</a>
                ${meta ? `<div class="result-meta">${escapeHtml(meta)}</div>` : ''}
                <p class="result-text">${escapeHtml(truncate(result.snippet || 'No snippet supplied.', 420))}</p>
            </div>
        `;
    }

    function renderSkeleton() {
        return Array.from({ length: 3 }, () => `
            <div class="result-snippet" aria-hidden="true">
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
        `).join('');
    }

    function renderRawDetails(provider) {
        const raw = provider.raw || provider.error || { status: provider.status };
        return `
            <details class="raw-details">
                <summary>VIEW RAW JSON</summary>
                <pre class="raw-json">${escapeHtml(JSON.stringify(raw, null, 2))}</pre>
            </details>
        `;
    }

    function getStatusLabel(provider) {
        switch (provider.status) {
            case 'loading':
                return 'Loading';
            case 'ok':
                return provider.requestId ? `OK / ${provider.requestId}` : 'OK';
            case 'skipped':
                return 'Skipped';
            case 'error':
                return 'Error';
            default:
                return 'Idle';
        }
    }

    function getSignals(provider) {
        if (provider.status === 'loading') return '...';
        if (provider.status === 'skipped') return 'KEY';
        if (provider.status === 'error') return 'ERR';

        const hasDate = provider.results?.some((result) => result.publishedDate || result.updatedDate);
        const hasScore = provider.results?.some((result) => typeof result.score === 'number');
        const signals = [
            hasDate ? 'DATE' : null,
            hasScore ? 'SCORE' : null,
            provider.nativeCost != null ? 'COST' : null,
            provider.nativeUsage != null ? 'USAGE' : null,
            provider.results?.some((result) => result.snippet) ? 'TEXT' : null,
        ].filter(Boolean);

        return signals.length ? signals.join('+') : '-';
    }

    function formatLatency(value) {
        return typeof value === 'number' ? `${value}ms` : '-';
    }

    function formatScore(value) {
        return value.toFixed(value > 1 ? 1 : 3);
    }

    function formatDate(value) {
        return String(value).slice(0, 10);
    }

    function truncate(value, maxLength) {
        const text = String(value || '').replace(/\s+/g, ' ').trim();
        if (text.length <= maxLength) return text;
        return `${text.slice(0, maxLength - 3)}...`;
    }

    function clampNumber(value, min, max, fallback) {
        const number = Number.parseInt(value, 10);
        if (Number.isNaN(number)) return fallback;
        return Math.min(Math.max(number, min), max);
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
        return escapeHtml(value).replaceAll('`', '&#096;');
    }
</script>
</body>
</html>
