<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Comparator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg: oklch(0.985 0.006 255);
        --color-panel: oklch(0.998 0.004 255);
        --color-text: oklch(0.17 0.006 255);
        --color-muted: oklch(0.47 0.009 255);
        --color-soft: oklch(0.95 0.006 255);
        --color-input: oklch(0.91 0.007 255);
        --color-rule: oklch(0.17 0.006 255);
        --color-error: oklch(0.52 0.13 28);
        --color-warn: oklch(0.58 0.09 78);
        --border-style: 1px solid var(--color-rule);
        --font-mono: 'Space Mono', monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        height: 100vh;
        overflow: hidden;
    }

    h1, h2, h3, .mono, button, summary {
        font-family: var(--font-mono);
        text-transform: uppercase;
        font-weight: 400;
    }

    input {
        font-family: var(--font-mono);
        font-weight: 400;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    a:hover,
    a:focus-visible {
        text-decoration: underline;
    }

    :focus-visible {
        outline: 2px solid var(--color-text);
        outline-offset: -2px;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        border-left: var(--border-style);
        border-right: var(--border-style);
        margin: 0 20px;
        overflow: hidden;
    }

    .search-section {
        display: flex;
        border-bottom: var(--border-style);
    }

    .search-input-wrapper {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        border-right: var(--border-style);
    }

    .search-label {
        padding: 16px 12px;
        border-bottom: var(--border-style);
        font-size: 20px;
        line-height: 1;
        background: var(--color-text);
        color: var(--color-bg);
        font-weight: 700;
    }

    .search-input-row {
        display: block;
    }

    .search-input {
        width: 100%;
        border: none;
        padding: 22px 12px;
        font-size: 24px;
        outline: none;
        background: var(--color-input);
        box-shadow: inset 0 0 0 2px var(--color-text);
    }

    .search-input:focus {
        box-shadow: inset 0 0 0 3px var(--color-text);
    }

    .search-input::placeholder {
        color: var(--color-muted);
    }

    .search-button {
        width: 200px;
        background-color: var(--color-bg);
        color: var(--color-text);
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 12px;
        transition: background-color 0.2s, color 0.2s;
    }

    .search-button:hover,
    .search-button:focus-visible {
        background-color: var(--color-text);
        color: var(--color-bg);
    }

    .search-button:disabled {
        cursor: wait;
        color: var(--color-muted);
        background: var(--color-soft);
    }

    .search-button-top {
        text-align: right;
        font-size: 10px;
    }

    .search-button-main {
        font-size: 24px;
        text-align: center;
    }

    .results-area {
        background-color: var(--color-rule);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        gap: 1px;
        border-bottom: var(--border-style);
        flex-grow: 1;
        min-height: 0;
        overflow: hidden;
    }

    .provider-card {
        background-color: var(--color-panel);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
    }

    .card-header {
        border-bottom: var(--border-style);
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
    }

    .provider-name {
        font-size: 19px;
        font-weight: 700;
        line-height: 1;
    }

    .status-error {
        color: var(--color-error);
    }

    .status-skipped {
        color: var(--color-warn);
    }

    .metrics {
        text-align: right;
        flex: 0 0 auto;
    }

    .metric-item {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 9px;
        text-transform: uppercase;
    }

    .metric-label {
        color: var(--color-muted);
    }

    .card-body {
        padding: 12px;
        flex-grow: 1;
        min-height: 0;
        overflow-y: auto;
    }

    .result-snippet {
        border-bottom: 1px solid var(--color-soft);
    }

    .result-snippet:last-child {
        border-bottom: none;
    }

    .result-row {
        min-height: 44px;
        display: grid;
        grid-template-columns: 20px 1fr;
        align-items: center;
        gap: 6px;
        padding: 8px 0;
    }

    .expand-button {
        align-items: center;
        background: transparent;
        border: none;
        color: var(--color-muted);
        cursor: pointer;
        display: flex;
        font-family: var(--font-mono);
        font-size: 13px;
        height: 24px;
        justify-content: center;
        padding: 0;
        width: 20px;
        transition: transform 0.16s ease-out;
    }

    .result-snippet.is-open .expand-button {
        transform: rotate(90deg);
    }

    .result-content {
        display: none;
    }

    .result-snippet.is-open .result-content {
        display: block;
    }

    .result-title {
        color: inherit;
        display: inline-block;
        font-weight: 600;
        font-size: 13.5px;
        line-height: 1.28;
    }

    .result-title:hover,
    .result-title:focus-visible {
        text-decoration: underline;
    }

    .result-meta {
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 10px;
        margin: 0 0 4px 26px;
        overflow-wrap: anywhere;
        text-transform: uppercase;
    }

    .result-text {
        font-size: 12.5px;
        margin-left: 26px;
        padding-bottom: 12px;
    }

    .result-text a {
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    .state-message {
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.45;
        text-transform: uppercase;
    }

    .state-message strong {
        color: var(--color-text);
        font-weight: 700;
    }

    .skeleton-line {
        height: 12px;
        background: var(--color-soft);
        margin-bottom: 10px;
        position: relative;
        overflow: hidden;
    }

    .skeleton-line::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, oklch(0.985 0.004 255), transparent);
        animation: shimmer 1.1s infinite;
    }

    .skeleton-line.short {
        width: 55%;
    }

    .skeleton-line.medium {
        width: 78%;
    }

    @keyframes shimmer {
        to {
            transform: translateX(100%);
        }
    }

    .card-footer {
        border-top: var(--border-style);
    }

    .raw-button {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        background: transparent;
        border: none;
        color: var(--color-text);
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: uppercase;
    }

    .raw-button::after {
        content: "->";
    }

    .raw-button:hover,
    .raw-button:focus-visible {
        background: var(--color-soft);
    }

    .json-modal[hidden] {
        display: none;
    }

    .json-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 20px;
    }

    .json-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.64);
    }

    .json-modal-panel {
        position: relative;
        z-index: 1;
        width: min(920px, 100%);
        max-height: min(760px, calc(100vh - 40px));
        background: var(--color-bg);
        border: var(--border-style);
        display: flex;
        flex-direction: column;
    }

    .json-modal-header {
        min-height: 48px;
        border-bottom: var(--border-style);
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        font-family: var(--font-mono);
        text-transform: uppercase;
    }

    .json-modal-close {
        width: 36px;
        height: 32px;
        border: var(--border-style);
        background: transparent;
        cursor: pointer;
        font-family: var(--font-mono);
    }

    .json-modal-close:hover,
    .json-modal-close:focus-visible {
        background: var(--color-text);
        color: var(--color-bg);
    }

    .raw-json {
        flex: 1;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        text-transform: none;
        font-size: 10px;
        line-height: 1.45;
    }

    @media (max-width: 720px) {
        .app-container {
            margin: 0;
            border-left: none;
            border-right: none;
        }

        .search-section {
            flex-direction: column;
        }

        .search-input-wrapper {
            border-right: none;
        }

        .search-label {
            font-size: 15px;
        }

        .search-input {
            min-height: 88px;
            font-size: 18px;
        }

        .search-button {
            width: 100%;
            min-height: 76px;
            border-top: var(--border-style);
            flex-direction: row;
            align-items: center;
        }

        .search-button-top,
        .search-button-main {
            text-align: left;
        }

        .results-area {
            grid-template-columns: 1fr;
            grid-auto-rows: minmax(320px, 1fr);
            overflow-y: auto;
        }

        .provider-card {
            min-height: 320px;
        }
    }

    @media (min-width: 721px) and (max-width: 1180px) {
        .results-area {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
</style>
</head>
<body>

<div class="app-container">
    <section class="search-section">
        <div class="search-input-wrapper">
            <h1 class="search-label mono">API Result Comparison</h1>
            <div class="search-input-row">
                <input type="text" class="search-input" id="queryInput" value="Search API for AI Agents" placeholder="Enter query..." aria-label="Search query" autocomplete="off" autofocus>
            </div>
        </div>
        <button class="search-button" type="button" id="searchButton">
            <div class="search-button-top mono" id="buttonStatus">EXECUTE</div>
            <div class="search-button-main mono">SEARCH<br>-&gt;</div>
        </button>
    </section>

    <main class="results-area" id="resultsArea" aria-live="polite"></main>
</div>

<div class="json-modal" id="jsonModal" hidden>
    <div class="json-modal-backdrop" data-action="close-json"></div>
    <section class="json-modal-panel" role="dialog" aria-modal="true" aria-labelledby="jsonModalTitle">
        <div class="json-modal-header">
            <div id="jsonModalTitle">RAW JSON</div>
            <button class="json-modal-close" type="button" data-action="close-json" aria-label="Close raw JSON">X</button>
        </div>
        <pre class="raw-json" id="jsonModalBody"></pre>
    </section>
</div>

<script>
    const providers = [
        { id: 'liner', name: 'LINER' },
        { id: 'exa', name: 'EXA' },
        { id: 'perplexity', name: 'PERPLEXITY' },
        { id: 'parallel', name: 'PARALLEL' },
        { id: 'tavily', name: 'TAVILY' },
        { id: 'brave', name: 'BRAVE' },
    ];

    const state = {
        isSearching: false,
        providers: providers.map((provider) => ({
            ...provider,
            status: 'idle',
            latencyMs: null,
            resultCount: 0,
            defaultResults: null,
            requestId: null,
            nativeCost: null,
            nativeUsage: null,
            raw: null,
            results: [],
            error: null,
        })),
        lastRun: null,
        error: null,
    };

    const queryInput = document.querySelector('#queryInput');
    const searchButton = document.querySelector('#searchButton');
    const buttonStatus = document.querySelector('#buttonStatus');
    const resultsArea = document.querySelector('#resultsArea');
    const jsonModal = document.querySelector('#jsonModal');
    const jsonModalTitle = document.querySelector('#jsonModalTitle');
    const jsonModalBody = document.querySelector('#jsonModalBody');

    window.addEventListener('DOMContentLoaded', () => {
        queryInput.focus();
        queryInput.setSelectionRange(queryInput.value.length, queryInput.value.length);
        render();
        loadDefaultSnapshot();
    });

    searchButton.addEventListener('click', runSearch);

    resultsArea.addEventListener('click', (event) => {
        const rawButton = event.target.closest('[data-action="open-json"]');
        if (rawButton) {
            openJsonModal(rawButton.dataset.providerId);
            return;
        }

        const button = event.target.closest('[data-action="toggle-result"]');
        if (!button) return;

        const result = button.closest('.result-snippet');
        const content = result?.querySelector('.result-content');
        if (!result || !content) return;

        const isOpen = result.classList.toggle('is-open');
        button.setAttribute('aria-expanded', String(isOpen));
        button.setAttribute('aria-label', isOpen ? 'Collapse result' : 'Expand result');
        content.hidden = !isOpen;
    });

    jsonModal.addEventListener('click', (event) => {
        if (event.target.closest('[data-action="close-json"]')) {
            closeJsonModal();
        }
    });

    window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !jsonModal.hidden) {
            closeJsonModal();
        }
    });

    queryInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            runSearch();
        }
    });

    async function runSearch() {
        const query = queryInput.value.trim();

        if (!query || state.isSearching) return;

        state.isSearching = true;
        state.error = null;
        state.lastRun = null;
        state.providers = providers.map((provider) => ({
            ...provider,
            status: 'loading',
            latencyMs: null,
            resultCount: 0,
            defaultResults: null,
            requestId: null,
            nativeCost: null,
            nativeUsage: null,
            raw: null,
            results: [],
            error: null,
        }));
        render();

        try {
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query }),
            });
            const payload = await response.json();

            if (!response.ok) {
                throw new Error(payload.error || 'Search failed');
            }

            state.providers = payload.providers;
            state.lastRun = payload;
        } catch (error) {
            state.error = error.message || 'Search failed';
            state.providers = providers.map((provider) => ({
                ...provider,
                status: 'error',
                latencyMs: null,
                resultCount: 0,
                defaultResults: null,
                requestId: null,
                nativeCost: null,
                nativeUsage: null,
                raw: null,
                results: [],
                error: { message: state.error },
            }));
        } finally {
            state.isSearching = false;
            render();
        }
    }

    async function loadDefaultSnapshot() {
        try {
            const response = await fetch('/benchmark/default-results.json', { cache: 'no-store' });
            if (!response.ok) throw new Error('Default snapshot unavailable');

            const payload = await response.json();
            state.providers = payload.providers || state.providers;
            state.lastRun = payload;
            render();
        } catch (error) {
            state.error = 'Default snapshot not found';
            render();
        }
    }

    function render() {
        searchButton.disabled = state.isSearching;
        buttonStatus.textContent = state.isSearching ? 'RUNNING' : 'EXECUTE';
        resultsArea.innerHTML = state.providers.map(renderProviderCard).join('');
    }

    function renderProviderCard(provider) {
        return `
            <article class="provider-card" data-provider-id="${escapeAttribute(provider.id)}">
                <div class="card-header">
                    <div>
                        <div class="provider-name mono">${escapeHtml(provider.name)}</div>
                    </div>
                    <div class="metrics">
                        <div class="metric-item"><span class="metric-label">LAT:</span> ${formatLatency(provider.latencyMs)}</div>
                        <div class="metric-item"><span class="metric-label">CST:</span> ${formatCost(provider.nativeCost)}</div>
                        <div class="metric-item"><span class="metric-label">SIG:</span> ${escapeHtml(getSignals(provider))}</div>
                    </div>
                </div>
                <div class="card-body">
                    ${renderProviderBody(provider)}
                </div>
                <div class="card-footer">
                    ${renderRawButton(provider)}
                </div>
            </article>
        `;
    }

    function renderProviderBody(provider) {
        if (provider.status === 'loading') return renderSkeleton();

        if (provider.status === 'idle') {
            return '<div class="state-message">Awaiting search execution.</div>';
        }

        if (provider.status === 'skipped') {
            return `<div class="state-message"><strong>Skipped</strong><br>${escapeHtml(provider.error?.message || 'Missing API key')}</div>`;
        }

        if (provider.status === 'error') {
            const status = provider.error?.httpStatus ? `HTTP ${provider.error.httpStatus}` : 'REQUEST ERROR';
            return `<div class="state-message status-error"><strong>${escapeHtml(status)}</strong><br>${escapeHtml(provider.error?.message || 'Provider failed')}</div>`;
        }

        if (!provider.results || provider.results.length === 0) {
            return '<div class="state-message">No normalized results returned.</div>';
        }

        return provider.results.map(renderResult).join('');
    }

    function renderResult(result, index) {
        const meta = [
            result.publishedDate ? `PUB ${formatDate(result.publishedDate)}` : null,
            result.updatedDate ? `UPD ${formatDate(result.updatedDate)}` : null,
            typeof result.score === 'number' ? `SCORE ${formatScore(result.score)}` : null,
            result.favicon ? 'FAVICON' : null,
        ].filter(Boolean).join(' / ');

        return `
            <div class="result-snippet">
                <div class="result-row">
                    <button class="expand-button" type="button" data-action="toggle-result" aria-expanded="false" aria-label="Expand result">&gt;</button>
                    <a href="${escapeAttribute(result.url || '#')}" class="result-title" target="_blank" rel="noreferrer">${escapeHtml(result.title || `Result ${index + 1}`)}</a>
                </div>
                <div class="result-content" hidden>
                    ${meta ? `<div class="result-meta">${escapeHtml(meta)}</div>` : ''}
                    <p class="result-text">${renderMarkdownInline(truncate(result.snippet || 'No snippet supplied.', 1200))}</p>
                </div>
            </div>
        `;
    }

    function renderSkeleton() {
        return Array.from({ length: 3 }, () => `
            <div class="result-snippet" aria-hidden="true">
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
        `).join('');
    }

    function renderRawButton(provider) {
        return `
            <button class="raw-button" type="button" data-action="open-json" data-provider-id="${escapeAttribute(provider.id)}">VIEW RAW JSON</button>
        `;
    }

    function openJsonModal(providerId) {
        const provider = state.providers.find((item) => item.id === providerId);
        if (!provider) return;

        const payload = {
            provider: provider.name,
            status: getStatusLabel(provider),
            latencyMs: provider.latencyMs,
            resultCount: provider.resultCount ?? provider.results?.length ?? 0,
            defaultResults: provider.defaultResults,
            requestId: provider.requestId,
            nativeCost: provider.nativeCost,
            nativeUsage: provider.nativeUsage,
            error: provider.error,
            raw: provider.raw || provider.error || { status: provider.status },
        };

        jsonModalTitle.textContent = `${provider.name} RAW JSON`;
        jsonModalBody.textContent = JSON.stringify(payload, null, 2);
        jsonModal.hidden = false;
        jsonModal.querySelector('[data-action="close-json"]').focus();
    }

    function closeJsonModal() {
        jsonModal.hidden = true;
        jsonModalBody.textContent = '';
    }

    function getStatusLabel(provider) {
        switch (provider.status) {
            case 'loading':
                return 'Loading';
            case 'ok':
                return 'OK';
            case 'skipped':
                return 'Skipped';
            case 'error':
                return 'Error';
            default:
                return 'Idle';
        }
    }

    function getSignals(provider) {
        if (provider.status === 'loading') return '...';
        if (provider.status === 'skipped') return 'KEY';
        if (provider.status === 'error') return 'ERR';

        const hasDate = provider.results?.some((result) => result.publishedDate || result.updatedDate);
        const hasScore = provider.results?.some((result) => typeof result.score === 'number');
        const signals = [
            hasDate ? 'DATE' : null,
            hasScore ? 'SCORE' : null,
            provider.nativeCost != null ? 'COST' : null,
            provider.nativeUsage != null ? 'USAGE' : null,
            provider.results?.some((result) => result.snippet) ? 'TEXT' : null,
        ].filter(Boolean);

        return signals.length ? signals.join('+') : '-';
    }

    function formatLatency(value) {
        return typeof value === 'number' ? `${value}ms` : '-';
    }

    function formatCost(value) {
        if (typeof value !== 'number') return '-';
        if (value === 0) return '$0';
        return `$${value.toFixed(value < 0.01 ? 3 : 2)}`;
    }

    function formatScore(value) {
        return value.toFixed(value > 1 ? 1 : 3);
    }

    function formatDate(value) {
        return String(value).slice(0, 10);
    }

    function truncate(value, maxLength) {
        const text = String(value || '').replace(/\s+/g, ' ').trim();
        if (text.length <= maxLength) return text;
        return `${text.slice(0, maxLength - 3)}...`;
    }

    function renderMarkdownInline(value) {
        const text = String(value || '');
        const parts = [];
        let cursor = 0;
        const linkPattern = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
        let match;

        while ((match = linkPattern.exec(text)) !== null) {
            parts.push(escapeHtml(text.slice(cursor, match.index)));
            parts.push(`<a href="${escapeAttribute(match[2])}" target="_blank" rel="noreferrer">${escapeHtml(match[1])}</a>`);
            cursor = match.index + match[0].length;
        }

        parts.push(escapeHtml(text.slice(cursor)));
        return parts.join('');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
        return escapeHtml(value).replaceAll('`', '&#096;');
    }
</script>
</body>
